name: "Terraform CI/CD"

on:
  push:
    branches:
      - terraform
      - terraform-2
  pull_request:
    branches:
      - terraform
      - terraform-2

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  PLAN: plan.tfplan

jobs:
  # 1. ETAPA DE VALIDACIÓN (Corre en ambas ramas: terraform y terraform-2)
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init

      - name: Validar archivos .tf
        run: terraform validate

  # 2. ETAPA DE PLAN (SÓLO corre en la rama principal 'terraform')
  plan:
    name: "Plan"
    needs: validate
    if: github.ref == 'refs/heads/terraform'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init

      - name: Generar el Plan de Terraform
        run: terraform plan -out=${{ env.PLAN }}

      - name: Comentar en la Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const execSync = require('child_process').execSync;
            const planOutput = execSync('terraform show -no-color ' + process.env.PLAN).toString();
            const body = `#### Resultado del Plan de Terraform 🤖\n\`\`\`diff\n${planOutput}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      - name: Guardar Plan como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan
          path: ${{ env.PLAN }}

  # 3. ETAPA DE APLICACIÓN (SÓLO corre en la rama principal 'terraform')
  apply:
    name: "Apply"
    needs: plan
    if: github.ref == 'refs/heads/terraform' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init

      - name: Descargar el artefacto del Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan

      - name: Aplicar cambios (terraform apply)
        run: terraform apply -input=false ${{ env.PLAN }}

  # 4. ETAPA DE DESTRUCCIÓN (SÓLO corre en la rama principal 'terraform')
  destroy:
    name: "Destroy"
    needs: apply
    if: github.ref == 'refs/heads/terraform' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: destroy-env
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init

      - name: Destruir recursos
        run: terraform destroy --auto-approve
